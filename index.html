<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futures: Learn to Trade</title>
<meta name="description" content="A plain-language introduction to futures trading: contracts, margin, risk, and a profit-and-loss calculator to practice with.">
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#14202b;--muted:#4a5a68;--line:#c9d3da;--gain:#17693f;--loss:#b3372f;--mark:#f2c94c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1820;--surface:#172430;--ink:#e8eef2;--muted:#9fb0bd;--line:#2c3e4c;--gain:#4cc38a;--loss:#ff7b70}}
:root[data-theme="dark"]{--bg:#0f1820;--surface:#172430;--ink:#e8eef2;--muted:#9fb0bd;--line:#2c3e4c;--gain:#4cc38a;--loss:#ff7b70}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,6vw,3.6rem)}
h2{font-size:1.7rem}
p{max-width:65ch}
a{color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;justify-content:space-between;padding-top:.9rem;padding-bottom:.9rem}
.brand{font:700 1.2rem Georgia,serif;text-decoration:none}
nav ul{display:flex;gap:1.25rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{text-decoration:none;padding:.4rem 0;display:inline-block}
nav a:hover{text-decoration:underline}
.hero{padding:3rem 0 2rem}
.hero p.lead{font-size:1.15rem;color:var(--muted)}
.calc{background:var(--surface);border:2px solid var(--ink);padding:1.25rem;margin-top:1.5rem}
.calc h2{font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:1rem}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.25rem}
select,input{width:100%;min-height:2.75rem;padding:.5rem;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
.result{margin-top:1.25rem;padding-top:1rem;border-top:1px dashed var(--line)}
.pnl{font:700 2.6rem Georgia,serif;margin:.1em 0}
.pnl.gain{color:var(--gain)}.pnl.loss{color:var(--loss)}
.detail,.hint{color:var(--muted);font-size:.9rem;margin:0}
.err{color:var(--loss);font-weight:600}
section{padding:2.5rem 0;border-top:1px solid var(--line)}
ol.path{padding-left:1.25rem}
ol.path li{margin-bottom:.9rem;max-width:65ch}
details{background:var(--surface);border:1px solid var(--line);padding:.75rem 1rem;margin-bottom:.6rem}
summary{cursor:pointer;font-weight:600}
details p{margin:.5rem 0 0}
.risk{background:var(--surface);border-left:6px solid var(--loss);padding:1rem 1.25rem}
footer{border-top:1px solid var(--line);padding:1.5rem 0;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#top">Futures</a>
    <nav aria-label="Main"><ul>
      <li><a href="#calculator">Calculator</a></li>
      <li><a href="#path">Learning path</a></li>
      <li><a href="#terms">Key terms</a></li>
      <li><a href="#risk">Risk</a></li>
      <li><a
